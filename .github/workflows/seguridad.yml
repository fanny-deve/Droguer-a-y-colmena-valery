name: seguridad

on:
  push:
    branches: [backend, main, desarrollo]
  pull_request:
    branches: [desarrollo, main]
  schedule:
    - cron: '0 8 * * 1'      # cada lunes: nuevas vulnerabilidades de dependencias

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: Análisis estático CodeQL (${{ matrix.lenguaje }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lenguaje: [java-kotlin, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.lenguaje }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.lenguaje }}

  trivy:
    name: Vulnerabilidades de dependencias y secretos (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escanear el repositorio (dependencias, configuración y secretos)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: core-api/src/test
