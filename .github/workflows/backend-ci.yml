name: backend-ci

on:
  push:
    branches: [backend]
  pull_request:
    branches: [desarrollo, main]

permissions:
  contents: write   # necesario para publicar el resumen del build como comentario del commit

jobs:
  core-api:
    name: core-api (Maven + PostgreSQL real con Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar y probar
        id: build
        continue-on-error: true
        working-directory: core-api
        run: |
          set -o pipefail
          mvn -B -ntp verify 2>&1 | tee "$GITHUB_WORKSPACE/build-core.log"
      - name: Publicar resumen del build
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build-core.log', 'utf8'); } catch (e) { log = 'sin log'; }
            const lineas = log.split('\n').map(l => l.length > 350 ? l.slice(0, 350) + '…' : l);
            const vistos = new Set();
            const unicas = lineas.filter(l => { if (vistos.has(l)) return false; vistos.add(l); return true; });
            const causas = unicas.filter(l => /Caused by|APPLICATION FAILED|Description:|Action:|UnsatisfiedDependency|BeanCreation|COMPILATION ERROR|\[ERROR\] .*\.java/.test(l)).slice(0, 40);
            const resumen = unicas.filter(l => /Tests run:|BUILD|FAIL/.test(l)).slice(-25);
            const cuerpo = ['--- CAUSAS (primeras) ---', ...causas, '--- RESUMEN ---', ...resumen].join('\n').slice(0, 58000);
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner, repo: context.repo.repo, commit_sha: context.sha,
              body: `### CI core-api: ${{ steps.build.outcome }}\n\`\`\`\n${cuerpo}\n\`\`\``
            });
      - name: Fallar si el build falló
        if: steps.build.outcome == 'failure'
        run: exit 1

  analytics-service:
    name: analytics-service (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: analytics-service/requirements-dev.txt
      - name: Instalar y probar
        working-directory: analytics-service
        run: |
          pip install -r requirements-dev.txt
          pytest -q
