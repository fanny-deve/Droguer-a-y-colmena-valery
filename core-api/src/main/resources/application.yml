spring:
  application:
    name: pos-core-api
  lifecycle:
    timeout-per-shutdown-phase: 25s
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 500ms
      connect-timeout: 500ms
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}
  shutdown: graceful
  # 'native': Tomcat solo confía en X-Forwarded-* si vienen de proxies de red privada (evita falsificar la IP de origen)
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never

management:
  health:
    redis:
      enabled: false   # Redis es opcional: su caída no debe marcar la aplicación como no saludable
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-sin-id}] %logger{36} - %msg%n"

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  admin-bootstrap:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_INITIAL_PASSWORD:}
    nombre: ${ADMIN_NOMBRE:Administradora}
  analytics:
    url: ${ANALYTICS_URL:http://localhost:8000}
    api-key: ${ANALYTICS_API_KEY:}
  redis:
    enabled: ${REDIS_ENABLED:false}
  rate-limit:
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:20}
    api-per-minute: ${RATE_LIMIT_API_PER_MINUTE:900}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
