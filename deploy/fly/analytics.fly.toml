# Microservicio de proyección de demanda (Python). SIN IP pública: solo accesible desde la API por la red privada de Fly.
app = "valery-pos-analytics"
primary_region = "gru"

[env]
  PORT = "8000"
  HOST = "::"           # la red privada de Fly (.internal) usa IPv6

[http_service]
  internal_port = 8000
  force_https = false
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
